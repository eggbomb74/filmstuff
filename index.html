<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>ES ↔ EN Translator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --es: #c0392b;
      --en: #2471a3;
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #eaf0fb;
      --muted: #8899aa;
      --radius: 18px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      text-align: center;
      padding: 12px 16px 8px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      flex-shrink: 0;
    }

    header span { color: var(--text); }

    .panels {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 12px 12px;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      background: var(--card);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.25s, box-shadow 0.25s;
      min-height: 0;
    }

    .panel.es { border-color: var(--es); }
    .panel.en { border-color: var(--en); }

    /* Glow when this panel is the active listener */
    .panel.active-es {
      box-shadow: 0 0 0 3px var(--es), 0 0 20px rgba(192,57,43,0.35);
    }
    .panel.active-en {
      box-shadow: 0 0 0 3px var(--en), 0 0 20px rgba(36,113,163,0.35);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 6px;
      flex-shrink: 0;
    }

    .lang-label {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel.es .lang-label { color: var(--es); }
    .panel.en .lang-label { color: var(--en); }

    .flag { font-size: 1.4rem; }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.2s, box-shadow 0.2s;
    }

    .status-dot.listening {
      background: #2ecc71;
      box-shadow: 0 0 6px #2ecc71;
      animation: pulse 1s infinite;
    }

    .status-dot.translating {
      background: #f39c12;
      box-shadow: 0 0 6px #f39c12;
    }

    .status-dot.speaking {
      background: #9b59b6;
      box-shadow: 0 0 6px #9b59b6;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .text-area {
      flex: 1;
      padding: 4px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }

    .original {
      font-size: 1rem;
      color: var(--text);
      line-height: 1.4;
    }

    .translated {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.4;
      font-style: italic;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 5px;
    }

    .placeholder {
      color: var(--muted);
      font-size: 0.88rem;
      opacity: 0.55;
      margin: auto;
      text-align: center;
      padding: 8px;
    }

    .panel-footer {
      padding: 8px 14px 10px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .mic-btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .mic-btn:active { transform: scale(0.96); }
    .mic-btn:disabled { opacity: 0.35; cursor: default; }

    .panel.es .mic-btn { background: var(--es); color: #fff; }
    .panel.en .mic-btn { background: var(--en); color: #fff; }

    .mic-btn.recording { animation: btn-pulse 1s infinite; }

    @keyframes btn-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    .speak-btn {
      padding: 13px 15px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .speak-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.15); }
    .speak-btn:disabled { opacity: 0.3; cursor: default; }

    /* ── Auto toggle row ── */
    .auto-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 2px 12px;
      gap: 10px;
    }

    .auto-btn {
      flex: 1;
      padding: 11px 14px;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      background: transparent;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .auto-btn:active { transform: scale(0.97); }

    .auto-btn.on {
      background: #27ae60;
      border-color: #27ae60;
      color: #fff;
      box-shadow: 0 0 12px rgba(39,174,96,0.45);
      animation: auto-glow 2s infinite;
    }

    @keyframes auto-glow {
      0%, 100% { box-shadow: 0 0 12px rgba(39,174,96,0.45); }
      50% { box-shadow: 0 0 22px rgba(39,174,96,0.7); }
    }

    .auto-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
    }

    .auto-label.on { color: #2ecc71; }

    .error-banner {
      display: none;
      background: #c0392b;
      color: #fff;
      padding: 7px 16px;
      font-size: 0.82rem;
      text-align: center;
      flex-shrink: 0;
    }

    .error-banner.show { display: block; }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .panels { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

<header><span>🌐 Translator</span> &nbsp;ES ↔ EN</header>
<div class="error-banner" id="errorBanner"></div>

<div class="panels">

  <!-- Spanish panel -->
  <div class="panel es" id="esPanel">
    <div class="panel-header">
      <div class="lang-label"><span class="flag">🇪🇸</span> Español</div>
      <div class="status-dot" id="esDot"></div>
    </div>
    <div class="text-area" id="esText">
      <div class="placeholder" id="esPlaceholder">Toca el micrófono para hablar</div>
    </div>
    <div class="panel-footer">
      <button class="mic-btn" id="esMicBtn" onclick="manualListen('es')">🎤 Hablar</button>
      <button class="speak-btn" id="esSpeakBtn" onclick="speakLast('es')" disabled title="Repeat">🔊</button>
    </div>
  </div>

  <!-- Auto toggle -->
  <div class="auto-row">
    <button class="auto-btn" id="autoBtn" onclick="toggleAuto()">⚡ Auto &nbsp;OFF</button>
  </div>

  <!-- English panel -->
  <div class="panel en" id="enPanel">
    <div class="panel-header">
      <div class="lang-label"><span class="flag">🇺🇸</span> English</div>
      <div class="status-dot" id="enDot"></div>
    </div>
    <div class="text-area" id="enText">
      <div class="placeholder" id="enPlaceholder">Tap the mic to speak</div>
    </div>
    <div class="panel-footer">
      <button class="mic-btn" id="enMicBtn" onclick="manualListen('en')">🎤 Speak</button>
      <button class="speak-btn" id="enSpeakBtn" onclick="speakLast('en')" disabled title="Repeat">🔊</button>
    </div>
  </div>

</div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SS = window.speechSynthesis;

const lastTranslation = { es: null, en: null };
let activeRecognition = null;
let busy = false;

// Auto-mode state
let autoMode = false;
let autoNextLang = 'es'; // which language listens next in auto mode
let autoAborted = false;  // flag to stop the auto loop cleanly

// ── Utilities ─────────────────────────────────────────────────────────────

function showError(msg, duration = 3500) {
  const el = document.getElementById('errorBanner');
  el.textContent = msg;
  el.classList.add('show');
  if (duration) setTimeout(() => el.classList.remove('show'), duration);
}

function setDot(lang, state) {
  document.getElementById(lang + 'Dot').className = 'status-dot' + (state ? ' ' + state : '');
}

function setActivePanelGlow(lang) {
  document.getElementById('esPanel').classList.remove('active-es', 'active-en');
  document.getElementById('enPanel').classList.remove('active-es', 'active-en');
  if (lang) {
    document.getElementById('esPanel').classList.toggle('active-es', lang === 'es');
    document.getElementById('enPanel').classList.toggle('active-en', lang === 'en');
  }
}

function setManualBtnsDisabled(disabled) {
  document.getElementById('esMicBtn').disabled = disabled;
  document.getElementById('enMicBtn').disabled = disabled;
}

function addUtterance(lang, original, translated) {
  const container = document.getElementById(lang + 'Text');
  const placeholder = document.getElementById(lang + 'Placeholder');
  if (placeholder) placeholder.remove();

  const block = document.createElement('div');
  block.style.cssText = 'border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:8px;';

  const orig = document.createElement('div');
  orig.className = 'original';
  orig.textContent = original;

  const trans = document.createElement('div');
  trans.className = 'translated';
  trans.textContent = '→ ' + translated;

  block.appendChild(orig);
  block.appendChild(trans);
  container.appendChild(block);
  container.scrollTop = container.scrollHeight;

  document.getElementById(lang + 'SpeakBtn').disabled = false;
}

// ── Translation & TTS ─────────────────────────────────────────────────────

async function translate(text, fromLang, toLang) {
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Translation request failed');
  const data = await res.json();
  if (data.responseStatus !== 200) throw new Error(data.responseMessage || 'Translation error');
  return data.responseData.translatedText;
}

function speak(text, lang) {
  return new Promise((resolve) => {
    SS.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = lang === 'es' ? 'es-ES' : 'en-US';
    utt.rate = 0.95;
    const voices = SS.getVoices();
    const match = voices.find(v => v.lang.startsWith(lang)) || null;
    if (match) utt.voice = match;
    utt.onend = resolve;
    utt.onerror = resolve;
    SS.speak(utt);
  });
}

function speakLast(lang) {
  if (!lastTranslation[lang]) return;
  const { text, targetLang } = lastTranslation[lang];
  setDot(lang, 'speaking');
  speak(text, targetLang).then(() => setDot(lang, null));
}

// ── Manual mode ───────────────────────────────────────────────────────────

function manualListen(lang) {
  if (autoMode) return; // auto mode owns the mic
  if (busy) {
    // Tapping while recording stops it
    if (activeRecognition) activeRecognition.stop();
    return;
  }
  doListen(lang, { onDone: () => {} });
}

// ── Auto mode ─────────────────────────────────────────────────────────────

function toggleAuto() {
  if (!SR) {
    showError('Speech recognition not supported. Try Chrome (Android) or Safari 17+ (iOS).');
    return;
  }
  autoMode = !autoMode;
  const btn = document.getElementById('autoBtn');

  if (autoMode) {
    autoAborted = false;
    btn.textContent = '⏹ Auto ON — tap to stop';
    btn.classList.add('on');
    setManualBtnsDisabled(true);
    autoNextLang = 'es'; // always start with Spanish
    runAutoLoop();
  } else {
    stopAuto();
  }
}

function stopAuto() {
  autoMode = false;
  autoAborted = true;
  if (activeRecognition) activeRecognition.stop();
  const btn = document.getElementById('autoBtn');
  btn.textContent = '⚡ Auto  OFF';
  btn.classList.remove('on');
  setManualBtnsDisabled(false);
  setActivePanelGlow(null);
  busy = false;
}

function runAutoLoop() {
  if (autoAborted) return;
  const lang = autoNextLang;
  doListen(lang, {
    onDone: (success) => {
      if (autoAborted) return;
      if (success) autoNextLang = lang === 'es' ? 'en' : 'es'; // flip only on success
      // Brief pause so the speakers settle before re-opening mic
      setTimeout(() => { if (!autoAborted) runAutoLoop(); }, 300);
    }
  });
}

// ── Core listen/translate cycle ───────────────────────────────────────────

/**
 * Listen for one utterance in `lang`, translate it, speak it.
 * Calls onDone(success: boolean) when the cycle finishes.
 */
function doListen(lang, { onDone }) {
  if (!SR) { onDone(false); return; }
  if (activeRecognition) { activeRecognition.stop(); activeRecognition = null; }

  const targetLang = lang === 'es' ? 'en' : 'es';
  const btn = document.getElementById(lang + 'MicBtn');

  busy = true;
  setDot(lang, 'listening');
  setActivePanelGlow(lang);

  if (!autoMode) {
    btn.textContent = lang === 'es' ? '⏹ Parar' : '⏹ Stop';
    btn.classList.add('recording');
    setManualBtnsDisabled(true);
    btn.disabled = false; // keep active btn tappable to stop
  }

  const rec = new SR();
  activeRecognition = rec;
  rec.lang = lang === 'es' ? 'es-ES' : 'en-US';
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  let handled = false;

  async function finish(success) {
    if (handled) return;
    handled = true;
    activeRecognition = null;
    busy = false;

    if (!autoMode) {
      setDot(lang, null);
      setActivePanelGlow(null);
      btn.textContent = lang === 'es' ? '🎤 Hablar' : '🎤 Speak';
      btn.classList.remove('recording');
      setManualBtnsDisabled(false);
    }

    onDone(success);
  }

  rec.onresult = async (e) => {
    const spokenText = e.results[0][0].transcript.trim();
    if (!spokenText) { finish(false); return; }

    setDot(lang, 'translating');
    if (!autoMode) btn.textContent = lang === 'es' ? '⏳ Traduciendo…' : '⏳ Translating…';

    try {
      const translated = await translate(spokenText, lang, targetLang);
      addUtterance(lang, spokenText, translated);
      lastTranslation[lang] = { text: translated, targetLang };

      setDot(lang, 'speaking');
      if (!autoMode) setActivePanelGlow(null);
      await speak(translated, targetLang);
    } catch (err) {
      showError('Translation failed: ' + err.message);
      finish(false);
      return;
    }

    setDot(lang, null);
    finish(true);
  };

  rec.onerror = (e) => {
    if (e.error === 'no-speech') {
      // In auto mode, silently retry; in manual mode, show a hint
      if (!autoMode) showError('No speech detected — tap to try again.', 2000);
    } else if (e.error !== 'aborted') {
      showError('Mic error: ' + e.error);
    }
    finish(false);
  };

  rec.onend = () => { finish(false); };

  rec.start();
}

// Pre-load voices
SS.onvoiceschanged = () => SS.getVoices();
</script>
</body>
</html>
